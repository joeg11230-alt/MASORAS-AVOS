<div id="auth" class="wrap"><div class="card auth"><h3>Sign in</h3><label>Email<input id="email" type="email" autocomplete="username"></label><br><br><label>Password<div class="auth-row"><input id="password" type="password" autocomplete="current-password"><button id="showpass" type="button">Show</button></div></label><label class="remember"><input id="remember" type="checkbox" checked> Stay signed in & remember this device</label><div class="row"><button id="signin" class="primary">Sign In</button><button id="signup">Create Account</button></div><div style="margin-top:12px"><button id="forgot" class="linkbtn" type="button">Forgot password?</button></div><p id="authmsg" class="muted"></p></div></div>

<div id="vendorModal" class="modal"><div class="box"><h3>Vendor Information</h3><form id="vendorForm" class="form"><input id="vid" type="hidden"><label>Vendor Name<input id="vname" required></label><label>Contact Person<input id="vcontact"></label><label>Phone<input id="vphone"></label><label>Cell<input id="vcell"></label><label>WhatsApp<input id="vwhatsapp"></label><label>Email<input id="vemail" type="email"></label><label>Website<input id="vwebsite"></label><label>Delivery Days / Times<input id="vdays"></label><label>Delivery Details<input id="vdetails"></label><label class="full">Notes<textarea id="vnotes"></textarea></label><div class="full row"><button type="button" id="vcancel">Close</button><button type="button" id="vdelete" class="danger">Delete Vendor</button><button class="primary">Save Vendor</button></div></form><div id="vendorOrderSection"><div class="section-head"><div><h3 style="margin:0">Ordering Queue</h3><div class="muted">Items waiting to be ordered from this vendor</div></div><div id="vendorOrderActions" class="row"></div></div><div id="vendorOrderList" class="list"></div></div><div id="invoiceSection"><div class="section-head"><div><h3 style="margin:0">Invoices</h3><div class="muted">Invoices saved to this vendor profile</div></div><div class="row"><button id="manualInvoice" type="button">Add Manually</button><button id="scanInvoice" type="button" class="primary">Scan / Upload</button></div></div><div id="invoiceList" class="list"></div></div></div></div>
<div id="invoiceModal" class="modal"><div class="box" style="max-width:620px"><h3>Add Vendor Invoice</h3><form id="invoiceForm" class="form"><input id="invoiceVendorId" type="hidden"><label>Invoice Number<input id="invoiceNumber"></label><label>Invoice Date<input id="invoiceDate" type="date"></label><label>Amount<input id="invoiceAmount" type="number" step=".01"></label><label>Invoice File / Scan<input id="invoiceFile" type="file" accept="application/pdf,image/*" capture="environment"></label><label class="full">Notes<textarea id="invoiceNotes"></textarea></label><div class="full row"><button type="button" id="invoiceCancel">Cancel</button><button class="primary">Save Invoice</button></div></form><p id="invoiceMsg" class="muted"></p></div></div>

<script>
const SB='https://lwfrcwjahrzuxjgfialg.supabase.co',KEY='sb_publishable_lEImxF9Mc-ss7VxVLGeJ8w_cpgga_iO',SITE='https://joeg11230-alt.github.io/YMA-INVENTORY/';
const {createClient}=supabase,db=createClient(SB,KEY),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=v=>Number(v||0),order=x=>Math.max(num(x.target_stock)-num(x.qty_on_hand),0);
let items=[],vendors=[],queues=[],imageFile=null,currentVendorId=null,currentProductId=null,subscribed=false;
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m])),digits=s=>String(s||'').replace(/\D/g,''),safeUrl=u=>{if(!u)return'';try{return new URL(/^https?:\/\//i.test(u)?u:'https://'+u).href}catch{return''}};
function togglePass(id,b){let i=$(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'}
async function boot(){let saved=localStorage.getItem('yma_saved_email');if(saved)$('#email').value=saved;$('#remember').checked=localStorage.getItem('yma_remember')!=='false';const {data:{session}}=await db.auth.getSession();if(session&&!localStorage.getItem('yma_remember')&&!sessionStorage.getItem('yma_session_only'))await db.auth.signOut();else showSession(session);db.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY')$('#resetModal').classList.add('show');showSession(s)})}
function showSession(s){$('#auth').hidden=!!s;$('#app').hidden=!s;if(s){$('#who').textContent=s.user.email;loadAll();if(!subscribed){subscribe();subscribed=true}}}
async function loadAll(){let[a,b,q]=await Promise.all([db.from('inventory_items').select('*').order('vendor').order('item'),db.from('vendors').select('*').order('vendor'),db.from('vendor_order_queue').select('*').in('status',['queued','ordered','received']).order('added_at',{ascending:false})]);if(a.error)return alert(a.error.message);if(b.error)return alert(b.error.message);if(q.error)return alert(q.error.message);items=a.data||[];vendors=b.data||[];queues=q.data||[];render()}
function render(){renderInventory();renderNeeds();renderQueues();renderReceiving();renderVendors()}
function switchTab(n){$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));$$('.section').forEach(x=>x.classList.toggle('active',x.id===n))}
function vendorById(id){return vendors.find(v=>Number(v.id)===Number(id))}function vendorIdByName(n){let v=vendors.find(x=>x.vendor===n);return v?v.id:null}
function vendorNameButton(n){return '<button class="vendor-link vendor-open" data-vendor="'+esc(n)+'">'+esc(n)+'</button>'}
function bindVendorLinks(){$$('.vendor-open').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=vendorIdByName(b.dataset.vendor);switchTab('vendors');if(id)openVendor(id)})}
function renderInventory(){let vf=$('#vf'),cur=vf.value,vs=[...new Set(items.map(x=>x.vendor).filter(Boolean))];vf.innerHTML='<option value="">All vendors</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');vf.value=vs.includes(cur)?cur:'';let q=$('#search').value.toLowerCase(),rows=items.filter(x=>(!vf.value||x.vendor===vf.value)&&(!q||[x.item,x.vendor,x.category,x.barcode,x.sku,x.brand,x.storage_location].join(' ').toLowerCase().includes(q)));$('#grid').innerHTML=rows.map(x=>'<div class="card product-card" data-id="'+x.id+'">'+(x.image_url?'<img class="thumb" src="'+esc(x.image_url)+'" alt="'+esc(x.item)+'">':'<div class="thumb" style="display:flex;align-items:center;justify-content:center"><i class="bi bi-image" style="font-size:28px;color:#8995a6"></i></div>')+'<h3 class="product-title">'+esc(x.item)+'</h3><div class="muted">Vendor: '+vendorNameButton(x.vendor)+(x.brand?' • '+esc(x.brand):'')+(x.category?' • '+esc(x.category):'')+'</div><span class="pill">On hand: '+(x.qty_on_hand??0)+'</span><span class="pill">Target: '+(x.target_stock??0)+'</span><div class="'+(order(x)>0?'order':'ok')+'">'+(order(x)>0?'Order '+order(x):'Stock OK')+'</div><div class="click-hint">Click product to open full product information</div></div>').join('');$$('.product-card').forEach(c=>c.onclick=e=>{if(e.target.closest('.vendor-open'))return;openProductProfile(Number(c.dataset.id))});bindVendorLinks()}
function openProductProfile(id){let x=items.find(i=>Number(i.id)===Number(id));if(!x)return;currentProductId=id;$('#profileName').textContent=x.item;$('#profileVendor').innerHTML='Vendor: '+esc(x.vendor)+(x.brand?' • '+esc(x.brand):'');let photo=x.image_url?'<img class="profile-image" src="'+esc(x.image_url)+'" alt="'+esc(x.item)+'">':'<div class="profile-placeholder"><div><i class="bi bi-image" style="font-size:48px"></i><div>No product photo yet</div></div></div>';let fields=[['Brand',x.brand],['SKU / Product Code',x.sku],['Category',x.category],['Storage Location',x.storage_location],['Unit',x.unit],['Case / Pack Size',x.case_pack],['Pounds per Case',x.pounds_per_case],['Price',x.price!=null?'$'+num(x.price).toFixed(2):''],['Quantity On Hand',x.qty_on_hand],['Target Stock',x.target_stock],['Suggested Order Qty',order(x)],['Last Ordered Date',x.last_ordered_date],['Barcode',x.barcode]];$('#profileBody').innerHTML='<div>'+photo+'</div><div><div class="profile-grid">'+fields.map(([k,v])=>'<div class="profile-field"><b>'+k+':</b> '+esc(v??'')+'</div>').join('')+'</div>'+(x.product_description?'<div class="profile-desc"><b>Product Information</b><br>'+esc(x.product_description)+'</div>':'')+(x.notes?'<div class="profile-desc"><b>Notes</b><br>'+esc(x.notes)+'</div>':'')+'</div>';$('#profileQueue').style.display=order(x)>0?'inline-block':'none';$('#productModal').classList.add('show')}
$('#profileClose').onclick=()=>$('#productModal').classList.remove('show');$('#profileEdit').onclick=()=>{let id=currentProductId;$('#productModal').classList.remove('show');openItem(id)};$('#profileQueue').onclick=()=>addItemToQueue(currentProductId,true);
function renderNeeds(){let need=items.filter(x=>order(x)>0),g={};need.forEach(x=>(g[x.vendor]??=[]).push(x));$('#needwrap').innerHTML=Object.keys(g).length?Object.keys(g).sort().map(v=>'<div class="card" style="margin-bottom:12px"><div class="queue-title"><h3>'+vendorNameButton(v)+'</h3><button class="add-all" data-vendor="'+esc(v)+'">Add All to Queue</button></div><table><tr><th>Item</th><th>On Hand</th><th>Target</th><th>Suggested</th><th></th></tr>'+g[v].map(x=>{let q=queues.find(z=>Number(z.inventory_item_id)===Number(x.id)&&z.status==='queued');return '<tr><td><button class="vendor-link need-product" data-id="'+x.id+'">'+esc(x.item)+'</button></td><td>'+x.qty_on_hand+'</td><td>'+x.target_stock+'</td><td>'+order(x)+'</td><td>'+(q?'<button class="open-q" data-vid="'+vendorIdByName(v)+'">In Queue ('+q.qty+')</button>':'<button class="primary add-q" data-id="'+x.id+'">Add to Queue</button>')+'</td></tr>'}).join('')+'</table></div>').join(''):'<div class="card">Nothing needs ordering.</div>';bindVendorLinks();$$('.need-product').forEach(b=>b.onclick=()=>openProductProfile(Number(b.dataset.id)));$$('.add-q').forEach(b=>b.onclick=()=>addItemToQueue(Number(b.dataset.id),true));$$('.open-q').forEach(b=>b.onclick=()=>openVendorOrder(Number(b.dataset.vid)));$$('.add-all').forEach(b=>b.onclick=()=>addVendorNeedsToQueue(b.dataset.vendor))}
async function addItemToQueue(itemId,openAfter){let x=items.find(i=>Number(i.id)===Number(itemId));if(!x)return;let vid=vendorIdByName(x.vendor);if(!vid)return alert('Please create vendor information for '+x.vendor+' first.');let suggested=order(x)||1,existing=queues.find(q=>Number(q.vendor_id)===Number(vid)&&Number(q.inventory_item_id)===Number(itemId)&&q.status==='queued'),r;if(existing)r=await db.from('vendor_order_queue').update({qty:Math.max(num(existing.qty),suggested)}).eq('id',existing.id);else r=await db.from('vendor_order_queue').insert({vendor_id:vid,inventory_item_id:itemId,item_name:x.item,qty:suggested,unit:x.unit||null,status:'queued'});if(r.error)return alert(r.error.message);await loadAll();if(openAfter)openVendorOrder(vid)}
async function addVendorNeedsToQueue(vname){for(let x of items.filter(i=>i.vendor===vname&&order(i)>0))await addItemToQueue(x.id,false);let vid=vendorIdByName(vname);if(vid)openVendorOrder(vid)}
function openVendorOrder(vendorId){switchTab('queues');setTimeout(()=>{let el=document.querySelector('[data-queue-vendor="'+vendorId+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},100)}

function queueContactButtons(vendorId){let{v,rows,text,subject}=queueMessage(vendorId);if(!v||!rows.length)return'';let out='';if(v.email)out+='<a class="btn primary" href="mailto:'+encodeURIComponent(v.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text)+'"><i class="bi bi-envelope-fill"></i> Email Order</a>';let m=digits(v.whatsapp||v.cell||v.phone);if(m)out+='<a class="btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/'+m+'?text='+encodeURIComponent(text)+'"><i class="bi bi-whatsapp"></i> WhatsApp Order</a>';return out}
function renderQueues(){let active=queues.filter(q=>q.status==='queued'),g={};active.forEach(q=>(g[q.vendor_id]??=[]).push(q));let vids=Object.keys(g);$('#queuewrap').innerHTML=vids.length?vids.map(id=>{let v=vendorById(id),rows=g[id];return '<div class="card" data-queue-vendor="'+id+'" style="margin-bottom:12px"><div class="queue-title"><div><h3 style="margin:0">'+vendorNameButton(v?v.vendor:'Vendor')+'</h3><span class="badge">'+rows.length+' item'+(rows.length===1?'':'s')+' queued</span></div><div class="row">'+queueContactButtons(id)+'<button class="success close-order" data-vid="'+id+'"><i class="bi bi-check2-circle"></i> Close Order</button></div></div><table style="margin-top:10px"><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Notes</th><th></th></tr>'+rows.map(q=>'<tr><td><button class="vendor-link queue-product" data-item-id="'+(q.inventory_item_id||'')+'">'+esc(q.item_name)+'</button></td><td><input class="queue-qty q-qty" type="number" min="1" value="'+q.qty+'" data-id="'+q.id+'"></td><td>'+esc(q.unit||'')+'</td><td><input class="q-note" value="'+esc(q.notes||'')+'" data-id="'+q.id+'" placeholder="Optional"></td><td><button class="danger remove-q" data-id="'+q.id+'">Remove</button></td></tr>').join('')+'</table></div>'}).join(''):'<div class="card">No items are currently in an order queue.</div>';bindVendorLinks();$$('.queue-product').forEach(b=>b.onclick=()=>{if(b.dataset.itemId)openProductProfile(Number(b.dataset.itemId))});$$('.q-qty').forEach(i=>i.onchange=()=>updateQueue(i.dataset.id,{qty:Math.max(1,num(i.value))}));$$('.q-note').forEach(i=>i.onchange=()=>updateQueue(i.dataset.id,{notes:i.value.trim()||null}));$$('.remove-q').forEach(b=>b.onclick=()=>removeQueue(Number(b.dataset.id)));$$('.close-order').forEach(b=>b.onclick=()=>closeVendorOrder(Number(b.dataset.vid)))}
async function updateQueue(id,patch){let r=await db.from('vendor_order_queue').update(patch).eq('id',id);if(r.error)return alert(r.error.message);await loadAll()}
async function removeQueue(id){if(!confirm('Remove this item from the order queue?'))return;let r=await db.from('vendor_order_queue').delete().eq('id',id);if(r.error)return alert(r.error.message);await loadAll();if(currentVendorId)loadVendorOrderQueue(currentVendorId)}
async function closeVendorOrder(vendorId){let rows=queueRowsForVendor(vendorId);if(!rows.length)return;if(!confirm('Close this order and move it to Receiving?'))return;let now=new Date().toISOString(),ids=rows.map(x=>x.id),r=await db.from('vendor_order_queue').update({status:'ordered',ordered_at:now,closed_at:now}).in('id',ids);if(r.error)return alert(r.error.message);let today=now.slice(0,10);for(let q of rows){if(q.inventory_item_id)await db.from('inventory_items').update({last_ordered_date:today,updated_at:now}).eq('id',q.inventory_item_id)}await loadAll();switchTab('receiving')}
function renderReceiving(){let ordered=queues.filter(q=>q.status==='ordered'),g={};ordered.forEach(q=>(g[q.vendor_id]??=[]).push(q));let vids=Object.keys(g);$('#receivewrap').innerHTML=vids.length?vids.map(id=>{let v=vendorById(id),rows=g[id];return '<div class="card" style="margin-bottom:12px"><div class="queue-title"><div><h3 style="margin:0">Receiving: '+esc(v?v.vendor:'Vendor')+'</h3><div class="muted">Match delivery quantities against the closed order</div></div><button class="success receive-all" data-vid="'+id+'">Receive & Match</button></div><table style="margin-top:10px"><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Status</th></tr>'+rows.map(q=>'<tr><td><button class="vendor-link receive-product" data-item-id="'+(q.inventory_item_id||'')+'">'+esc(q.item_name)+'</button></td><td>'+q.qty+'</td><td><input class="receive-qty rqty" type="number" min="0" value="'+(q.received_qty||0)+'" data-id="'+q.id+'" data-ordered="'+q.qty+'"></td><td class="receive-status" id="status-'+q.id+'">'+receiveStatus(q.qty,q.received_qty||0)+'</td></tr>').join('')+'</table></div>'}).join(''):'<div class="card">No closed orders are waiting to be received.</div>';$$('.receive-product').forEach(b=>b.onclick=()=>{if(b.dataset.itemId)openProductProfile(Number(b.dataset.itemId))});$$('.rqty').forEach(i=>i.oninput=()=>$('#status-'+i.dataset.id).innerHTML=receiveStatus(num(i.dataset.ordered),num(i.value)));$$('.receive-all').forEach(b=>b.onclick=()=>receiveVendorOrder(Number(b.dataset.vid)))}
function receiveStatus(o,r){if(r===o)return '<span class="match">MATCH</span>';if(r<o)return '<span class="short">SHORT '+(o-r)+'</span>';return '<span class="over">OVER '+(r-o)+'</span>'}
async function receiveVendorOrder(vendorId){let rows=queues.filter(q=>Number(q.vendor_id)===Number(vendorId)&&q.status==='ordered');if(!rows.length)return;if(!confirm('Receive these quantities and add them to Quantity on Hand?'))return;let now=new Date().toISOString();for(let q of rows){let inp=document.querySelector('.rqty[data-id="'+q.id+'"]'),received=Math.max(0,num(inp?inp.value:q.received_qty));if(q.inventory_item_id&&received>0){let item=items.find(x=>Number(x.id)===Number(q.inventory_item_id));if(item){let rr=await db.from('inventory_items').update({qty_on_hand:num(item.qty_on_hand)+received,updated_at:now}).eq('id',item.id);if(rr.error)return alert(rr.error.message)}}let qr=await db.from('vendor_order_queue').update({received_qty:received,received_at:now,status:'received'}).eq('id',q.id);if(qr.error)return alert(qr.error.message)}await loadAll();alert('Receiving completed and inventory quantities were updated.')}
function renderVendors(){$('#vgrid').innerHTML=vendors.map(v=>{let queued=queueRowsForVendor(v.id).length,wa=digits(v.whatsapp),url=safeUrl(v.website);return '<div class="card" data-vid="'+v.id+'"><h3>'+vendorNameButton(v.vendor)+'</h3><div class="contact-line"><b>Contact:</b> '+esc(v.contact_person||'')+'</div><div class="contact-line"><b>Phone:</b> '+esc(v.phone||'')+'</div><div class="contact-line"><b>Cell:</b> '+esc(v.cell||'')+'</div><div class="contact-line"><b>WhatsApp:</b> '+(wa?'<a class="iconlink" target="_blank" href="https://wa.me/'+wa+'"><i class="bi bi-whatsapp"></i>'+esc(v.whatsapp)+'</a>':'')+'</div><div class="contact-line"><b>Email:</b> '+(v.email?'<a class="iconlink" href="mailto:'+encodeURIComponent(v.email)+'"><i class="bi bi-envelope-fill"></i>'+esc(v.email)+'</a>':'')+'</div><div class="contact-line"><b>Website:</b> '+(url?'<a target="_blank" href="'+esc(url)+'">'+esc(v.website)+'</a>':'')+'</div><div class="muted">Delivery: '+esc(v.delivery_days||'')+'</div><div class="actions" style="margin-top:10px"><button class="open-vendor">Open Vendor</button>'+(queued?'<button class="open-vqueue" data-id="'+v.id+'">Order Queue ('+queued+')</button>':'')+'</div></div>'}).join('');$$('.open-vendor').forEach(b=>b.onclick=()=>openVendor(Number(b.closest('.card').dataset.vid)));$$('.open-vqueue').forEach(b=>b.onclick=()=>openVendorOrder(Number(b.dataset.id)));bindVendorLinks()}
function openItem(id){let x=id?items.find(y=>Number(y.id)===Number(id)):{id:'',vendor:'',item:'',brand:'',sku:'',category:'',storage_location:'',unit:'',case_pack:'',pounds_per_case:'',price:'',qty_on_hand:0,target_stock:0,last_ordered_date:'',notes:'',product_description:'',barcode:'',image_url:''};currentProductId=id||null;for(const[f,k]of[['id','id'],['vendor','vendor'],['item','item'],['brand','brand'],['sku','sku'],['category','category'],['storage','storage_location'],['unit','unit'],['casepack','case_pack'],['pounds','pounds_per_case'],['price','price'],['qty','qty_on_hand'],['target','target_stock'],['date','last_ordered_date'],['description','product_description'],['notes','notes'],['barcode','barcode']])$('#'+f).value=x[k]??'';$('#oq').value=order(x);$('#del').style.display=id?'inline-block':'none';$('#productFormTitle').textContent=id?'Edit Product':'Add Product';imageFile=null;$('#pic').value='';$('#photoPreviewWrap').innerHTML=x.image_url?'<img class="photo-preview" src="'+esc(x.image_url)+'">':'<span class="muted">No photo yet</span>';$('#modal').classList.add('show')}

$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#id').value,p={vendor:$('#vendor').value.trim(),item:$('#item').value.trim(),brand:$('#brand').value.trim()||null,sku:$('#sku').value.trim()||null,category:$('#category').value.trim()||null,storage_location:$('#storage').value.trim()||null,unit:$('#unit').value.trim()||null,case_pack:$('#casepack').value.trim()||null,pounds_per_case:$('#pounds').value||null,price:$('#price').value||null,qty_on_hand:$('#qty').value||0,target_stock:$('#target').value||0,last_ordered_date:$('#date').value||null,product_description:$('#description').value.trim()||null,notes:$('#notes').value.trim()||null,barcode:$('#barcode').value.trim()||null,updated_at:new Date().toISOString()};if(imageFile){let path=Date.now()+'-'+imageFile.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('product-images').upload(path,imageFile);if(u.error)return alert(u.error.message);p.image_url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}let r=id?await db.from('inventory_items').update(p).eq('id',id):await db.from('inventory_items').insert(p);if(r.error)return alert(r.error.message);closeItem();await loadAll();if(id)openProductProfile(Number(id))}

async function loadVendorOrderQueue(vendorId){let rows=queueRowsForVendor(vendorId);$('#vendorOrderActions').innerHTML=queueContactButtons(vendorId)+(rows.length?'<button class="success" id="vendorCloseOrder">Close Order</button>':'');if($('#vendorCloseOrder'))$('#vendorCloseOrder').onclick=()=>closeVendorOrder(vendorId);$('#vendorOrderList').innerHTML=rows.length?rows.map(q=>'<div class="subcard"><div class="queue-title"><b>'+esc(q.item_name)+'</b><div class="row"><input class="queue-qty vendor-q-qty" type="number" min="1" value="'+q.qty+'" data-id="'+q.id+'"><button class="danger vendor-q-remove" data-id="'+q.id+'">Remove</button></div></div></div>').join(''):'<div class="muted">No items are waiting in this vendor’s order queue.</div>';$$('.vendor-q-qty').forEach(i=>i.onchange=()=>updateQueue(i.dataset.id,{qty:Math.max(1,num(i.value))}));$$('.vendor-q-remove').forEach(b=>b.onclick=()=>removeQueue(Number(b.dataset.id)))}

$('#vendorForm').onsubmit=async e=>{e.preventDefault();let id=$('#vid').value,p={vendor:$('#vname').value.trim(),contact_person:$('#vcontact').value.trim()||null,phone:$('#vphone').value.trim()||null,cell:$('#vcell').value.trim()||null,whatsapp:$('#vwhatsapp').value.trim()||null,email:$('#vemail').value.trim()||null,website:$('#vwebsite').value.trim()||null,delivery_days:$('#vdays').value.trim()||null,delivery_details:$('#vdetails').value.trim()||null,notes:$('#vnotes').value.trim()||null,updated_at:new Date().toISOString()},old=id?vendors.find(v=>String(v.id)===String(id)):null;let r=id?await db.from('vendors').update(p).eq('id',id).select().single():await db.from('vendors').insert(p).select().single();if(r.error)return alert(r.error.message);if(old&&old.vendor!==p.vendor){let q=await db.from('inventory_items').update({vendor:p.vendor,updated_at:new Date().toISOString()}).eq('vendor',old.vendor);if(q.error)return alert(q.error.message)}currentVendorId=r.data.id;$('#vid').value=r.data.id;await loadAll();await loadVendorOrderQueue(currentVendorId);await loadInvoices(currentVendorId);alert('Vendor saved.')}
$('#vdelete').onclick=async()=>{let id=$('#vid').value,v=vendors.find(x=>String(x.id)===String(id));if(!v)return;if(items.some(x=>x.vendor===v.vendor))return alert('This vendor still has inventory items assigned to it. Reassign them first.');if(!confirm('Delete vendor '+v.vendor+'?'))return;let r=await db.from('vendors').delete().eq('id',id);if(r.error)return alert(r.error.message);closeVendor();await loadAll()}
async function loadInvoices(vendorId){$('#invoiceList').innerHTML='<div class="muted">Loading invoices...</div>';let r=await db.from('vendor_invoices').select('*').eq('vendor_id',vendorId).order('invoice_date',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});if(r.error)return $('#invoiceList').innerHTML='<div class="order">'+esc(r.error.message)+'</div>';let rows=r.data||[];$('#invoiceList').innerHTML=rows.length?rows.map(inv=>'<div class="subcard"><div class="queue-title"><div><b>Invoice '+esc(inv.invoice_number||'(no number)')+'</b><div class="muted">'+esc(inv.invoice_date||'No date')+(inv.file_name?' • '+esc(inv.file_name):'')+'</div></div><b>'+(inv.amount!=null?'$'+num(inv.amount).toFixed(2):'')+'</b></div>'+(inv.notes?'<div style="margin-top:6px">'+esc(inv.notes)+'</div>':'')+'<div class="actions" style="margin-top:8px">'+(inv.file_path?'<button class="open-invoice" data-path="'+esc(inv.file_path)+'">Open</button>':'')+'<button class="danger delete-invoice" data-id="'+inv.id+'" data-path="'+esc(inv.file_path||'')+'">Delete</button></div></div>').join(''):'<div class="muted">No invoices saved yet.</div>';$$('.open-invoice').forEach(b=>b.onclick=()=>openInvoiceFile(b.dataset.path));$$('.delete-invoice').forEach(b=>b.onclick=()=>deleteInvoice(Number(b.dataset.id),b.dataset.path))}
