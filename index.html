<header><h2>YMA Kitchen & Maintenance Inventory</h2><div>Shared live inventory</div></header>
<div id="auth" class="wrap"><div class="card auth"><h3>Sign in</h3><label>Email<input id="email" type="email" autocomplete="username"></label><br><br><label>Password<div class="auth-row"><input id="password" type="password" autocomplete="current-password"><button id="showpass" type="button">Show</button></div></label><label class="remember"><input id="remember" type="checkbox" checked> Stay signed in & remember this device</label><div class="row"><button id="signin" class="primary">Sign In</button><button id="signup">Create Account</button></div><div style="margin-top:12px"><button id="forgot" class="linkbtn" type="button">Forgot password?</button></div><p id="authmsg" class="muted"></p></div></div>

<script>
const SB='https://lwfrcwjahrzuxjgfialg.supabase.co',KEY='sb_publishable_lEImxF9Mc-ss7VxVLGeJ8w_cpgga_iO',SITE='https://joeg11230-alt.github.io/YMA-INVENTORY/';
const {createClient}=supabase,db=createClient(SB,KEY),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=v=>Number(v||0),order=x=>Math.max(num(x.target_stock)-num(x.qty_on_hand),0);

function togglePass(id,b){let i=$(id);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'}
async function boot(){let saved=localStorage.getItem('yma_saved_email');if(saved)$('#email').value=saved;$('#remember').checked=localStorage.getItem('yma_remember')!=='false';const {data:{session}}=await db.auth.getSession();showSession(session);db.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY')$('#resetModal').classList.add('show');showSession(s)})}
function showSession(s){$('#auth').hidden=!!s;$('#app').hidden=!s;if(s){$('#who').textContent=s.user.email;loadAll();if(!subscribed){subscribe();subscribed=true}}}
async function loadAll(){let[a,b,q]=await Promise.all([db.from('inventory_items').select('*').order('vendor').order('item'),db.from('vendors').select('*').order('vendor'),db.from('vendor_order_queue').select('*').in('status',['queued','ordered','received']).order('added_at',{ascending:false})]);if(a.error)return alert(a.error.message);if(b.error)return alert(b.error.message);if(q.error)return alert(q.error.message);items=a.data||[];vendors=b.data||[];queues=q.data||[];render()}
function render(){renderInventory();renderNeeds();renderQueues();renderReceiving();renderVendors()}
function switchTab(n){$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));$$('.section').forEach(x=>x.classList.toggle('active',x.id===n))}
function vendorById(id){return vendors.find(v=>Number(v.id)===Number(id))}function vendorIdByName(n){let v=vendors.find(x=>x.vendor===n);return v?v.id:null}function itemById(id){return items.find(x=>Number(x.id)===Number(id))}function vendorNameButton(n){return '<button class="vendor-link vendor-open" data-vendor="'+esc(n)+'">'+esc(n)+'</button>'}function bindVendorLinks(){$$('.vendor-open').forEach(b=>b.onclick=()=>{let id=vendorIdByName(b.dataset.vendor);switchTab('vendors');if(id)openVendor(id)})}
function renderInventory(){let vf=$('#vf'),cur=vf.value,vs=[...new Set(items.map(x=>x.vendor).filter(Boolean))];vf.innerHTML='<option value="">All vendors</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');vf.value=vs.includes(cur)?cur:'';let q=$('#search').value.toLowerCase(),rows=items.filter(x=>(!vf.value||x.vendor===vf.value)&&(!q||[x.item,x.vendor,x.category,x.barcode,x.sku,x.brand].join(' ').toLowerCase().includes(q)));$('#grid').innerHTML=rows.map(x=>'<div class="card product-card" data-id="'+x.id+'">'+(x.image_url?'<img class="thumb" src="'+esc(x.image_url)+'">':'')+'<h3 class="product-title">'+esc(x.item)+'</h3><div class="muted">Vendor: '+vendorNameButton(x.vendor)+'</div><span class="pill">On hand: '+(x.qty_on_hand??0)+'</span><span class="pill">Target: '+(x.target_stock??0)+'</span><div class="'+(order(x)>0?'order':'ok')+'">'+(order(x)>0?'Order '+order(x):'Stock OK')+'</div><div class="click-hint">Click product for full details</div></div>').join('');$$('.product-card').forEach(c=>c.onclick=e=>{if(e.target.closest('.vendor-open'))return;openProductProfile(Number(c.dataset.id))});bindVendorLinks()}
function renderNeeds(){let need=items.filter(x=>order(x)>0),g={};need.forEach(x=>(g[x.vendor]??=[]).push(x));$('#needwrap').innerHTML=Object.keys(g).length?Object.keys(g).map(v=>'<div class="card" style="margin-bottom:12px"><div class="queue-title"><h3>'+vendorNameButton(v)+'</h3><button class="add-all" data-vendor="'+esc(v)+'">Add All to Queue</button></div><table><tr><th>Item</th><th>On Hand</th><th>Target</th><th>Suggested</th><th></th></tr>'+g[v].map(x=>{let q=queues.find(z=>Number(z.inventory_item_id)===Number(x.id)&&z.status==='queued');return '<tr><td>'+esc(x.item)+'</td><td>'+x.qty_on_hand+'</td><td>'+x.target_stock+'</td><td>'+order(x)+'</td><td>'+(q?'<button class="open-q" data-vid="'+vendorIdByName(v)+'">In Queue ('+q.qty+')</button>':'<button class="primary add-q" data-id="'+x.id+'">Add to Queue</button>')+'</td></tr>'}).join('')+'</table></div>').join(''):'<div class="card">Nothing needs ordering.</div>';bindVendorLinks();$$('.add-q').forEach(b=>b.onclick=()=>addItemToQueue(Number(b.dataset.id),true));$$('.open-q').forEach(b=>b.onclick=()=>openVendorOrder(Number(b.dataset.vid)));$$('.add-all').forEach(b=>b.onclick=()=>addVendorNeedsToQueue(b.dataset.vendor))}
async function addItemToQueue(itemId,openAfter){let x=itemById(itemId);if(!x)return;let vid=vendorIdByName(x.vendor);if(!vid)return alert('Please create vendor information first.');let suggested=order(x)||1,existing=queues.find(q=>Number(q.vendor_id)===Number(vid)&&Number(q.inventory_item_id)===Number(itemId)&&q.status==='queued'),r;if(existing)r=await db.from('vendor_order_queue').update({qty:Math.max(num(existing.qty),suggested)}).eq('id',existing.id);else r=await db.from('vendor_order_queue').insert({vendor_id:vid,inventory_item_id:itemId,item_name:x.item,qty:suggested,unit:x.unit||null,status:'queued'});if(r.error)return alert(r.error.message);await loadAll();if(openAfter)openVendorOrder(vid)}
async function addVendorNeedsToQueue(vname){for(let x of items.filter(i=>i.vendor===vname&&order(i)>0))await addItemToQueue(x.id,false);let vid=vendorIdByName(vname);if(vid)openVendorOrder(vid)}function openVendorOrder(id){switchTab('queues');setTimeout(()=>document.querySelector('[data-queue-vendor="'+id+'"]')?.scrollIntoView({behavior:'smooth'}),100)}function queueRowsForVendor(id){return queues.filter(q=>Number(q.vendor_id)===Number(id)&&q.status==='queued')}

function orderText(vendorId){let v=vendorById(vendorId),rows=queueRowsForVendor(vendorId),t=queueTotals(rows),lines=['YMA Purchase Order','Vendor: '+(v?.vendor||''),'Order Date: '+new Date().toLocaleDateString(),''];rows.forEach(q=>{let item=itemById(q.inventory_item_id),price=num(item?.price);lines.push('- '+q.item_name+': '+q.qty+(q.unit?' '+q.unit:'')+' @ '+money(price)+' = '+money(q.qty*price))});lines.push('','Total Cases: '+t.cases,'Grand Total: '+money(t.grand));return{v,rows,text:lines.join('\n'),subject:'YMA Purchase Order - '+(v?.vendor||'Vendor')}}
function queueContactButtons(vendorId){let{v,rows,text,subject}=orderText(vendorId);if(!v||!rows.length)return'';let out='';if(v.email)out+='<a class="btn primary" href="mailto:'+encodeURIComponent(v.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text)+'"><i class="bi bi-envelope-fill"></i> Email</a>';let sms=digits(v.cell||v.phone);if(sms)out+='<a class="btn" href="sms:'+sms+'?body='+encodeURIComponent(text)+'"><i class="bi bi-chat-dots-fill"></i> Text</a>';let wa=digits(v.whatsapp||v.cell||v.phone);if(wa)out+='<a class="btn whatsapp" target="_blank" href="https://wa.me/'+wa+'?text='+encodeURIComponent(text)+'"><i class="bi bi-whatsapp"></i> WhatsApp</a>';return out}
function renderQueues(){let active=queues.filter(q=>q.status==='queued'),g={};active.forEach(q=>(g[q.vendor_id]??=[]).push(q));$('#queuewrap').innerHTML=Object.keys(g).length?Object.keys(g).map(id=>{let v=vendorById(id),rows=g[id],t=queueTotals(rows);return '<div class="card" data-queue-vendor="'+id+'" style="margin-bottom:12px"><div class="queue-title"><div><h3 style="margin:0">'+vendorNameButton(v?.vendor||'Vendor')+'</h3><span class="badge">'+rows.length+' item'+(rows.length===1?'':'s')+'</span></div><div class="row"><button class="create-po" data-vid="'+id+'">Create Order</button>'+queueContactButtons(id)+'<button class="success close-order" data-vid="'+id+'">Close Order</button></div></div><table style="margin-top:10px"><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Line Total</th><th>Notes</th><th></th></tr>'+rows.map(q=>{let item=itemById(q.inventory_item_id),price=num(item?.price);return '<tr><td>'+esc(q.item_name)+'</td><td><input class="queue-qty q-qty" type="number" min="1" value="'+q.qty+'" data-id="'+q.id+'"></td><td>'+esc(q.unit||'')+'</td><td>'+money(price)+'</td><td><b>'+money(q.qty*price)+'</b></td><td><input class="q-note" value="'+esc(q.notes||'')+'" data-id="'+q.id+'"></td><td><button class="danger remove-q" data-id="'+q.id+'">Remove</button></td></tr>'}).join('')+'</table><div class="order-summary"><span>Total Cases: '+t.cases+'</span><span class="po-total">Grand Total: '+money(t.grand)+'</span></div></div>'}).join(''):'<div class="card">No items are currently in an order queue.</div>';bindVendorLinks();$$('.q-qty').forEach(i=>i.onchange=()=>updateQueue(i.dataset.id,{qty:Math.max(1,num(i.value))}));$$('.q-note').forEach(i=>i.onchange=()=>updateQueue(i.dataset.id,{notes:i.value.trim()||null}));$$('.remove-q').forEach(b=>b.onclick=()=>removeQueue(Number(b.dataset.id)));$$('.close-order').forEach(b=>b.onclick=()=>closeVendorOrder(Number(b.dataset.vid)));$$('.create-po').forEach(b=>b.onclick=()=>openPurchaseOrder(Number(b.dataset.vid)))}
function openPurchaseOrder(vendorId){let v=vendorById(vendorId),rows=queueRowsForVendor(vendorId),t=queueTotals(rows);if(!rows.length)return;$('#poVendorName').textContent=v?.vendor||'Vendor';$('#poMeta').innerHTML='<div><b>Order Date:</b> '+new Date().toLocaleDateString()+'</div><div><b>Order Received Date:</b> Pending</div>'+(v?.contact_person?'<div><b>Contact:</b> '+esc(v.contact_person)+'</div>':'')+(v?.phone?'<div><b>Phone:</b> '+esc(v.phone)+'</div>':'');$('#poTable').innerHTML='<table><tr><th>Item</th><th>SKU</th><th>Cases</th><th>Unit</th><th>Unit Price</th><th>Total</th></tr>'+rows.map(q=>{let item=itemById(q.inventory_item_id),price=num(item?.price);return '<tr><td>'+esc(q.item_name)+'</td><td>'+esc(item?.sku||'')+'</td><td>'+q.qty+'</td><td>'+esc(q.unit||'')+'</td><td>'+money(price)+'</td><td>'+money(q.qty*price)+'</td></tr>'}).join('')+'</table>';$('#poTotals').innerHTML='<span>Total Cases: '+t.cases+'</span><span class="po-total">Grand Total: '+money(t.grand)+'</span>';$('#poActions').innerHTML='<button onclick="window.print()"><i class="bi bi-printer-fill"></i> Print Order</button><button class="primary" id="poVendorProfile">Vendor Profile</button>'+queueContactButtons(vendorId)+'<button class="success" id="poCloseOrder">Close Order</button>';$('#poVendorProfile').onclick=()=>{$('#poModal').classList.remove('show');switchTab('vendors');openVendor(vendorId)};$('#poCloseOrder').onclick=()=>closeVendorOrder(vendorId);$('#poModal').classList.add('show')}
async function updateQueue(id,patch){let r=await db.from('vendor_order_queue').update(patch).eq('id',id);if(r.error)return alert(r.error.message);await loadAll()}async function removeQueue(id){if(!confirm('Remove this item?'))return;let r=await db.from('vendor_order_queue').delete().eq('id',id);if(r.error)return alert(r.error.message);await loadAll()}
async function closeVendorOrder(vendorId){let rows=queueRowsForVendor(vendorId);if(!rows.length)return;if(!confirm('Close this order and move it to Receiving?'))return;let now=new Date().toISOString(),ids=rows.map(x=>x.id),r=await db.from('vendor_order_queue').update({status:'ordered',ordered_at:now,closed_at:now}).in('id',ids);if(r.error)return alert(r.error.message);for(let q of rows)if(q.inventory_item_id)await db.from('inventory_items').update({last_ordered_date:now.slice(0,10),updated_at:now}).eq('id',q.inventory_item_id);$('#poModal').classList.remove('show');await loadAll();switchTab('receiving')}
function renderReceiving(){let ordered=queues.filter(q=>q.status==='ordered'),g={};ordered.forEach(q=>(g[q.vendor_id]??=[]).push(q));$('#receivewrap').innerHTML=Object.keys(g).length?Object.keys(g).map(id=>{let v=vendorById(id),rows=g[id],orderDate=rows[0]?.ordered_at;return '<div class="card" style="margin-bottom:12px"><div class="queue-title"><div><h3 style="margin:0">Receiving: '+esc(v?.vendor||'Vendor')+'</h3><div class="muted">Order Date: '+fmtDate(orderDate)+' • Order Received Date: Pending</div></div><button class="success receive-all" data-vid="'+id+'">Receive & Match</button></div><table style="margin-top:10px"><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Status</th></tr>'+rows.map(q=>'<tr><td>'+esc(q.item_name)+'</td><td>'+q.qty+'</td><td><input class="receive-qty rqty" type="number" min="0" value="'+(q.received_qty||0)+'" data-id="'+q.id+'" data-ordered="'+q.qty+'"></td><td id="status-'+q.id+'">'+receiveStatus(q.qty,q.received_qty||0)+'</td></tr>').join('')+'</table></div>'}).join(''):'<div class="card">No closed orders are waiting to be received.</div>';$$('.rqty').forEach(i=>i.oninput=()=>$('#status-'+i.dataset.id).innerHTML=receiveStatus(num(i.dataset.ordered),num(i.value)));$$('.receive-all').forEach(b=>b.onclick=()=>receiveVendorOrder(Number(b.dataset.vid)))}function receiveStatus(o,r){if(r===o)return '<span class="match">MATCH</span>';if(r<o)return '<span class="short">SHORT '+(o-r)+'</span>';return '<span class="over">OVER '+(r-o)+'</span>'}
async function receiveVendorOrder(vendorId){let rows=queues.filter(q=>Number(q.vendor_id)===Number(vendorId)&&q.status==='ordered');if(!rows.length)return;if(!confirm('Receive these quantities and add them to Quantity on Hand?'))return;let now=new Date().toISOString();for(let q of rows){let inp=document.querySelector('.rqty[data-id="'+q.id+'"]'),received=Math.max(0,num(inp?.value));if(q.inventory_item_id&&received>0){let item=itemById(q.inventory_item_id),rr=await db.from('inventory_items').update({qty_on_hand:num(item?.qty_on_hand)+received,updated_at:now}).eq('id',q.inventory_item_id);if(rr.error)return alert(rr.error.message)}let qr=await db.from('vendor_order_queue').update({received_qty:received,received_at:now,status:'received'}).eq('id',q.id);if(qr.error)return alert(qr.error.message)}await loadAll();alert('Order received on '+new Date(now).toLocaleDateString()+'. Inventory was updated.')}
function renderVendors(){$('#vgrid').innerHTML=vendors.map(v=>'<div class="card" data-vid="'+v.id+'"><h3>'+vendorNameButton(v.vendor)+'</h3><div class="contact-line"><b>Contact:</b> '+esc(v.contact_person||'')+'</div><div class="contact-line"><b>Phone:</b> '+esc(v.phone||'')+'</div><div class="contact-line"><b>Cell:</b> '+esc(v.cell||'')+'</div><div class="contact-line"><b>Email:</b> '+(v.email?'<a href="mailto:'+encodeURIComponent(v.email)+'">'+esc(v.email)+'</a>':'')+'</div><div class="actions"><button class="open-vendor">Open Vendor</button>'+(queueRowsForVendor(v.id).length?'<button class="open-vqueue" data-id="'+v.id+'">Order Queue</button>':'')+'</div></div>').join('');$$('.open-vendor').forEach(b=>b.onclick=()=>openVendor(Number(b.closest('.card').dataset.vid)));$$('.open-vqueue').forEach(b=>b.onclick=()=>openVendorOrder(Number(b.dataset.id)));bindVendorLinks()}
function openProductProfile(id){let x=itemById(id);if(!x)return;currentProductId=id;$('#profileName').textContent=x.item;$('#profileVendor').textContent='Vendor: '+(x.vendor||'');$('#profileBody').innerHTML=(x.image_url?'<img class="profile-image" src="'+esc(x.image_url)+'">':'<div class="profile-placeholder">No photo</div>')+'<div><div class="profile-grid"><div class="profile-field"><b>Brand:</b> '+esc(x.brand||'')+'</div><div class="profile-field"><b>SKU:</b> '+esc(x.sku||'')+'</div><div class="profile-field"><b>Category:</b> '+esc(x.category||'')+'</div><div class="profile-field"><b>Storage:</b> '+esc(x.storage_location||'')+'</div><div class="profile-field"><b>Unit:</b> '+esc(x.unit||'')+'</div><div class="profile-field"><b>Case Pack:</b> '+esc(x.case_pack||'')+'</div><div class="profile-field"><b>Price:</b> '+(x.price!=null?money(x.price):'')+'</div><div class="profile-field"><b>Barcode:</b> '+esc(x.barcode||'')+'</div></div>'+(x.product_description?'<div class="profile-desc">'+esc(x.product_description)+'</div>':'')+'</div>';$('#profileEdit').onclick=()=>{$('#productModal').classList.remove('show');openItem(id)};$('#profileQueue').onclick=()=>addItemToQueue(id,true);$('#productModal').classList.add('show')}$('#profileClose').onclick=()=>$('#productModal').classList.remove('show');
function openItem(id){let x=id?itemById(id):{id:'',vendor:'',item:'',brand:'',sku:'',category:'',storage_location:'',unit:'',case_pack:'',pounds_per_case:'',price:'',qty_on_hand:0,target_stock:0,last_ordered_date:'',notes:'',product_description:'',barcode:'',image_url:''};for(const[f,k]of[['id','id'],['vendor','vendor'],['item','item'],['brand','brand'],['sku','sku'],['category','category'],['storage','storage_location'],['unit','unit'],['casepack','case_pack'],['pounds','pounds_per_case'],['price','price'],['qty','qty_on_hand'],['target','target_stock'],['date','last_ordered_date'],['description','product_description'],['notes','notes'],['barcode','barcode']])$('#'+f).value=x[k]??'';$('#oq').value=order(x);$('#del').style.display=id?'inline-block':'none';imageFile=null;$('#photoPreviewWrap').innerHTML=x.image_url?'<img class="photo-preview" src="'+esc(x.image_url)+'">':'No photo';$('#modal').classList.add('show')}function closeItem(){$('#modal').classList.remove('show')}$('#qty').oninput=$('#target').oninput=()=>$('#oq').value=Math.max(num($('#target').value)-num($('#qty').value),0);$('#pic').onchange=e=>imageFile=e.target.files[0]||null;$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#id').value,p={vendor:$('#vendor').value.trim(),item:$('#item').value.trim(),brand:$('#brand').value.trim()||null,sku:$('#sku').value.trim()||null,category:$('#category').value.trim()||null,storage_location:$('#storage').value.trim()||null,unit:$('#unit').value.trim()||null,case_pack:$('#casepack').value.trim()||null,pounds_per_case:$('#pounds').value||null,price:$('#price').value||null,qty_on_hand:$('#qty').value||0,target_stock:$('#target').value||0,last_ordered_date:$('#date').value||null,product_description:$('#description').value.trim()||null,notes:$('#notes').value.trim()||null,barcode:$('#barcode').value.trim()||null,updated_at:new Date().toISOString()};if(imageFile){let path=Date.now()+'-'+imageFile.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('product-images').upload(path,imageFile);if(u.error)return alert(u.error.message);p.image_url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}let r=id?await db.from('inventory_items').update(p).eq('id',id):await db.from('inventory_items').insert(p);if(r.error)return alert(r.error.message);closeItem();await loadAll()};$('#cancel').onclick=closeItem;$('#add').onclick=()=>openItem(null);
async function openVendor(id){let v=vendorById(id)||{id:'',vendor:'',contact_person:'',phone:'',cell:'',whatsapp:'',email:'',website:'',delivery_days:'',delivery_details:'',notes:''};currentVendorId=id||null;for(const[f,k]of[['vid','id'],['vname','vendor'],['vcontact','contact_person'],['vphone','phone'],['vcell','cell'],['vwhatsapp','whatsapp'],['vemail','email'],['vwebsite','website'],['vdays','delivery_days'],['vdetails','delivery_details'],['vnotes','notes']])$('#'+f).value=v[k]??'';$('#vendorModal').classList.add('show');if(id)loadVendorOrderQueue(id)}function loadVendorOrderQueue(id){let rows=queueRowsForVendor(id),t=queueTotals(rows);$('#vendorOrderActions').innerHTML=rows.length?'<button class="create-vendor-po">Create Order</button>'+queueContactButtons(id)+'<button class="success vendor-close-order">Close Order</button>':'';$('.create-vendor-po')&&($('.create-vendor-po').onclick=()=>openPurchaseOrder(id));$('.vendor-close-order')&&($('.vendor-close-order').onclick=()=>closeVendorOrder(id));$('#vendorOrderList').innerHTML=rows.length?rows.map(q=>'<div class="subcard"><b>'+esc(q.item_name)+'</b> — '+q.qty+' '+esc(q.unit||'')+'</div>').join('')+'<div class="order-summary"><span>Total Cases: '+t.cases+'</span><span>Grand Total: '+money(t.grand)+'</span></div>':'No queued items'}$('#vcancel').onclick=()=>$('#vendorModal').classList.remove('show');$('#addVendor').onclick=()=>openVendor(null);
$('#poClose').onclick=()=>$('#poModal').classList.remove('show');$('#search').oninput=renderInventory;$('#vf').onchange=renderInventory;$$('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#showpass').onclick=e=>togglePass('#password',e.currentTarget);$('#shownewpass').onclick=e=>togglePass('#newpass',e.currentTarget);$('#signin').onclick=async()=>{let r=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#authmsg').textContent=r.error?r.error.message:'Signed in'};$('#signup').onclick=async()=>{let r=await db.auth.signUp({email:$('#email').value.trim(),password:$('#password').value});$('#authmsg').textContent=r.error?r.error.message:'Account created'};$('#forgot').onclick=async()=>{let r=await db.auth.resetPasswordForEmail($('#email').value.trim(),{redirectTo:SITE});$('#authmsg').textContent=r.error?r.error.message:'Reset email sent'};$('#saveNewPass').onclick=async()=>{let r=await db.auth.updateUser({password:$('#newpass').value});$('#resetmsg').textContent=r.error?r.error.message:'Password updated'};$('#resetCancel').onclick=()=>$('#resetModal').classList.remove('show');$('#signout').onclick=()=>db.auth.signOut();function subscribe(){db.channel('yma-live').on('postgres_changes',{event:'*',schema:'public',table:'inventory_items'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'vendors'},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'vendor_order_queue'},loadAll).subscribe()}
