;if(id)openVendor(id)})}function renderInventory(){let vf=$('#vf'),cur=vf.value,vs=[...new Set(items.map(x=>x.vendor).filter(Boolean))];vf.innerHTML='<option value="">All vendors</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');vf.value=vs.includes(cur)?cur:'';let q=$('#search').value.toLowerCase(),rows=items.filter(x=>(!vf.value||x.vendor===vf.value)&&(!q||[x.item,x.vendor,x.category,x.barcode].join(' ').toLowerCase().includes(q)));$('#grid').innerHTML=rows.map(x=>'<div class="card" data-id="'+x.id+'">'+(x.image_url?'<img class="thumb" src="'+esc(x.image_url)+'">':'')+'<h3>'+esc(x.item)+'</h3><div class="muted">Vendor: '+vendorNameButton(x.vendor)+' • '+esc(x.category||'')+'</div><span class="pill">On hand: '+(x.qty_on_hand??0)+'</span><span class="pill">Target: '+(x.target_stock??0)+'</span><div class="'+(order(x)>0?'order':'ok')+'">'+(order(x)>0?'Order '+order(x):'Stock OK')+'</div><button class="edit">Edit</button></div>').join('');$$('.edit').forEach(b=>b.onclick=()=>openItem(Number(b.parentElement.dataset.id)));bindVendorLinks()}function renderNeeds(){let need=items.filter(x=>order(x)>0),g={};need.forEach(x=>(g[x.vendor]??=[]).push(x));$('#needwrap').innerHTML=Object.keys(g).length?Object.keys(g).sort().map(v=>'<div class="card" style="margin-bottom:12px"><div class="queue-title"><h3>'+vendorNameButton(v)+'</h3><button class="add-all" data-vendor="'+esc(v)+'">Add All to Queue</button></div><table><tr><th>Item</th><th>On Hand</th><th>Target</th><th>Suggested</th><th></th></tr>'+g[v].map(x=>{let q=queues.find(z=>z.inventory_item_id===x.id&&z.status==='queued');return '<tr><td><b>'+esc(x.item)+'</b></td><td>'+x.qty_on_hand+'</td><td>'+x.target_stock+'</td><td>'+order(x)+'</td><td>'+(q?'<button class="open-q" data-vid="'+vendorIdByName(v)+'">In Queue ('+q.qty+')</button>':'<button class="primary add-q" data-id="'+x.id+'">Add to Queue</button>')+'</td></tr>'}).join('')+'</table></div>').join(''):'<div class="card">Nothing needs ordering.</div>';$$('.add-q').forEach(b=>b.onclick=()=>addItemToQueue(Number(b.dataset.id),true));$$('.add-all').forEach(b=>b.onclick=()=>addVendorNeedsToQueue(b.dataset.vendor));$$('.open-q').forEach(b=>b.onclick=()=>openVendorOrder(Number(b.dataset.vid)));bindVendorLinks()}async function addItemToQueue(id,openAfter){let x=items.find(i=>i.id===id),vid=vendorIdByName(x.vendor);if(!vid)return alert('Create vendor information first.');let ex=queues.find(q=>q.vendor_id===vid&&q.inventory_item_id===id&&q.status==='queued'),r=ex?await db.from('vendor_order_queue').update({qty:Math.max(num(ex.qty),order(x)||1)}).eq('id',ex.id):await db.from('vendor_order_queue').insert({vendor_id:vid,inventory_item_id:id,item_name:x.item,qty:order(x)||1,unit:x.unit||null,status:'queued'});if(r.error)return alert(r.error.message);await loadAll();if(openAfter)openVendorOrder(vid)}async function addVendorNeedsToQueue(v){for(let x of items.filter(i=>i.vendor===v&&order(i)>0))await addItemToQueue(x.id,false);openVendorOrder(vendorIdByName(v))}function openVendorOrder(id){switchTab('queues');setTimeout(()=>document.querySelector('[data-queue-vendor="'+id+'"]')?.scrollIntoView({behavior:'smooth'}),100)}function queuedForVendor(id){return queues.filter(q=>Number(q.vendor_id)===Number(id)&&q.status==='queued')}function orderedForVendor(id){return queues.filter(q=>Number(q.vendor_id)===Number(id)&&q.status==='ordered')}function queueMessage(id){let v=vendorById(id),rows=queuedForVendor(id),lines=['Hello,','','Please send the following YMA order:',''];rows.forEach(q=>lines.push('- '+q.item_name+': '+q.qty+(q.unit?' '+q.unit:'')));lines.push('','Thank you.');return{v,rows,text:lines.join('\n'),subject:'YMA Order - '+(v?v.vendor:'Vendor')}}function queueContactButtons(id){let{v,rows,text,subject}=queueMessage(id);if(!v||!rows.length)return'';let out='';if(v.email)out+='<a class="btn primary" href="mailto:'+encodeURIComponent(v.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text)+'">Email Queue</a>';
