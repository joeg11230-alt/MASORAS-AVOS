<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YMA Kitchen & Maintenance Inventory</title>
<style>
:root{--b:#1f4e78;--bg:#f6f7f9;--line:#d9dee7;--muted:#687386;--green:#17733d;--red:#a61b1b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033}
header{background:var(--b);color:#fff;padding:16px}header h2{margin:0}.wrap{max-width:1150px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.auth{max-width:440px;margin:40px auto}
.row{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea,button{font:inherit}input,select,textarea{padding:9px;border:1px solid #cbd2dc;border-radius:8px;width:100%}
button{padding:9px 12px;border:1px solid #cbd2dc;border-radius:8px;background:#fff;cursor:pointer}button.primary{background:var(--b);color:#fff;border-color:var(--b)}
button.danger{color:var(--red);border-color:#e2a8a8}a.btn{display:inline-block;padding:9px 12px;border:1px solid #cbd2dc;border-radius:8px;background:#fff;color:#172033;text-decoration:none}
a.btn.primary{background:var(--b);color:#fff;border-color:var(--b)}
nav{display:flex;gap:6px;background:#fff;padding:10px 14px;border-bottom:1px solid var(--line);overflow:auto}.tab.active{background:var(--b);color:#fff}.section{display:none}.section.active{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;background:#e8f1f8;padding:4px 7px;border-radius:99px;margin:3px}.order{font-weight:bold;color:var(--red)}.ok{font-weight:bold;color:var(--green)}
.thumb{width:68px;height:68px;object-fit:cover;border-radius:8px;float:right}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.show{display:flex}
.box{background:#fff;border-radius:12px;padding:16px;max-width:780px;width:100%;max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid var(--line);padding:7px;text-align:left;font-size:13px}th{background:#eef3f7}.status{padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:13px}
.vendor-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.order-preview{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:13px;margin-top:8px}
@media(max-width:650px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h2>YMA Kitchen & Maintenance Inventory</h2><div>Shared live inventory</div></header>
<div id="auth" class="wrap"><div class="card auth"><h3>Sign in</h3><p class="muted">Use an email and password. New users can create an account below.</p><label>Email<input id="email" type="email"></label><br><br><label>Password<input id="password" type="password"></label><br><br><div class="row"><button class="primary" id="signin">Sign In</button><button id="signup">Create Account</button></div><p id="authmsg" class="muted"></p></div></div>
<div id="app" hidden>
<div class="status"><span id="who"></span> <button id="signout">Sign Out</button></div>
<nav><button class="tab active" data-tab="inventory">Inventory</button><button class="tab" data-tab="orders">Needs Ordering</button><button class="tab" data-tab="vendors">Vendors</button></nav>
<main class="wrap">
<section id="inventory" class="section active"><div class="toolbar"><input id="search" placeholder="Search item, vendor, barcode..." style="flex:2;min-width:200px"><select id="vf" style="flex:1;min-width:160px"><option value="">All vendors</option></select><button class="primary" id="add">+ Add Product</button></div><div id="grid" class="grid"></div></section>
<section id="orders" class="section"><div id="orderwrap"></div></section>
<section id="vendors" class="section"><div class="toolbar"><button class="primary" id="addVendor">+ Add Vendor</button></div><div id="vgrid" class="grid"></div></section>
</main></div>

<div id="modal" class="modal"><div class="box"><h3>Product</h3><form id="form" class="form">
<input id="id" type="hidden"><label>Picture<input id="pic" type="file" accept="image/*"></label><label>Barcode<div class="row"><input id="barcode" style="flex:1"><button type="button" id="scan">Scan</button></div></label>
<label>Vendor<input id="vendor" required></label><label>Item<input id="item" required></label><label>Category<input id="category"></label><label>Unit<input id="unit"></label><label>Pounds per Case<input id="pounds" type="number" step=".01"></label><label>Price<input id="price" type="number" step=".01"></label><label>Qty On Hand<input id="qty" type="number"></label><label>Target Stock<input id="target" type="number"></label><label>Order Qty (Auto)<input id="oq" disabled></label><label>Last Ordered Date<input id="date" type="date"></label><label class="full">Notes<textarea id="notes"></textarea></label>
<div class="full row"><button type="button" id="cancel">Cancel</button><button type="button" id="del" class="danger">Delete</button><button class="primary">Save</button></div></form></div></div>

<div id="vendorModal" class="modal"><div class="box"><h3>Vendor Information</h3><form id="vendorForm" class="form">
<input id="vid" type="hidden"><label>Vendor Name<input id="vname" required></label><label>Contact Person<input id="vcontact"></label><label>Phone<input id="vphone" type="tel"></label><label>Cell / WhatsApp<input id="vcell" type="tel" placeholder="Include country code, e.g. +1 555 555 5555"></label><label>Email<input id="vemail" type="email"></label><label>Website<input id="vwebsite" type="url" placeholder="https://..."></label><label>Delivery Days / Times<input id="vdays"></label><label>Delivery Details<input id="vdetails"></label><label class="full">Notes<textarea id="vnotes"></textarea></label>
<div class="full row"><button type="button" id="vcancel">Cancel</button><button type="button" id="vdelete" class="danger">Delete Vendor</button><button class="primary">Save Vendor</button></div></form></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script>
<script>
const SB='https://lwfrcwjahrzuxjgfialg.supabase.co',KEY='sb_publishable_lEImxF9Mc-ss7VxVLGeJ8w_cpgga_iO';
const {createClient}=supabase,db=createClient(SB,KEY),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=v=>Number(v||0),order=x=>Math.max(num(x.target_stock)-num(x.qty_on_hand),0);
let items=[],vendors=[],imageFile=null,subscribed=false;
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const safeUrl=u=>{if(!u)return'';try{return new URL(/^https?:\/\//i.test(u)?u:'https://'+u).href}catch{return''}};
async function boot(){const {data:{session}}=await db.auth.getSession();showSession(session);db.auth.onAuthStateChange((_e,s)=>showSession(s))}
function showSession(s){$('#auth').hidden=!!s;$('#app').hidden=!s;if(s){$('#who').textContent=s.user.email;loadAll();if(!subscribed){subscribe();subscribed=true}}}
async function loadAll(){let a=await db.from('inventory_items').select('*').order('vendor').order('item'),b=await db.from('vendors').select('*').order('vendor');if(a.error)return alert(a.error.message);if(b.error)return alert(b.error.message);items=a.data||[];vendors=b.data||[];render()}
function render(){renderInventory();renderOrders();renderVendors()}
function renderInventory(){let vf=$('#vf'),cur=vf.value,vs=[...new Set(items.map(x=>x.vendor).filter(Boolean))];vf.innerHTML='<option value="">All vendors</option>'+vs.map(v=>'<option>'+esc(v)+'</option>').join('');vf.value=vs.includes(cur)?cur:'';let q=$('#search').value.toLowerCase(),rows=items.filter(x=>(!vf.value||x.vendor===vf.value)&&(!q||[x.item,x.vendor,x.category,x.barcode].join(' ').toLowerCase().includes(q)));$('#grid').innerHTML=rows.map(x=>'<div class="card" data-id="'+x.id+'">'+(x.image_url?'<img class="thumb" src="'+esc(x.image_url)+'">':'')+'<h3>'+esc(x.item)+'</h3><div class="muted">'+esc(x.vendor)+' • '+esc(x.category)+'</div><span class="pill">On hand: '+(x.qty_on_hand??0)+'</span><span class="pill">Target: '+(x.target_stock??0)+'</span><div class="'+(order(x)>0?'order':'ok')+'">'+(order(x)>0?'Order '+order(x):'Stock OK')+'</div><button class="edit">Edit</button></div>').join('');$$('.edit').forEach(b=>b.onclick=()=>openItem(Number(b.parentElement.dataset.id)))}
function renderOrders(){let need=items.filter(x=>order(x)>0),groups={};need.forEach(x=>(groups[x.vendor]??=[]).push(x));$('#orderwrap').innerHTML=need.length?Object.keys(groups).sort().map(v=>'<div class="card" style="margin-bottom:12px"><h3>'+esc(v)+'</h3>'+orderTable(groups[v])+'<div class="vendor-actions">'+vendorActionButtons(v)+'</div></div>').join(''):'<div class="card">Nothing needs ordering.</div>'}
function orderTable(rows){return '<table><tr><th>Item</th><th>On Hand</th><th>Target</th><th>Order</th><th>Unit</th><th>Price</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.item)+'</td><td>'+(x.qty_on_hand??0)+'</td><td>'+(x.target_stock??0)+'</td><td><b>'+order(x)+'</b></td><td>'+esc(x.unit||'')+'</td><td>'+(x.price!=null?'$'+num(x.price).toFixed(2):'')+'</td></tr>').join('')+'</table>'}
function vendorActionButtons(vname){let v=vendors.find(z=>z.vendor===vname);if(!v)return'';let msg=buildOrderText(vname),subject='YMA Order - '+vname,out='';if(v.email)out+='<a class="btn primary" href="mailto:'+encodeURIComponent(v.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(msg)+'">Email Order</a>';let mobile=(v.cell||v.phone||'').replace(/\D/g,'');if(mobile)out+='<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+mobile+'?text='+encodeURIComponent(msg)+'">WhatsApp Order</a>';return out}
function buildOrderText(vname){let rows=items.filter(x=>x.vendor===vname&&order(x)>0);let lines=['Hello,','', 'Please send the following YMA order:',''];rows.forEach(x=>lines.push('- '+x.item+': '+order(x)+(x.unit?' '+x.unit:'')));lines.push('','Thank you.');return lines.join('\n')}
function renderVendors(){$('#vgrid').innerHTML=vendors.map(v=>{let url=safeUrl(v.website),need=items.filter(x=>x.vendor===v.vendor&&order(x)>0).length;return '<div class="card" data-vid="'+v.id+'"><h3>'+esc(v.vendor)+'</h3><div><b>Contact:</b> '+esc(v.contact_person||'')+'</div><div><b>Phone:</b> '+esc(v.phone||'')+'</div><div><b>Cell:</b> '+esc(v.cell||'')+'</div><div><b>Email:</b> '+(v.email?'<a href="mailto:'+encodeURIComponent(v.email)+'">'+esc(v.email)+'</a>':'')+'</div><div><b>Website:</b> '+(url?'<a target="_blank" rel="noopener" href="'+esc(url)+'">'+esc(v.website)+'</a>':'')+'</div><div class="muted" style="margin-top:6px">Delivery: '+esc(v.delivery_days||'')+'</div><div class="muted">'+esc(v.delivery_details||'')+'</div><div class="vendor-actions"><button class="vedit">Edit Vendor</button>'+(need?vendorActionButtons(v.vendor):'<span class="muted">No items need ordering</span>')+'</div></div>'}).join('');$$('.vedit').forEach(b=>b.onclick=()=>openVendor(Number(b.closest('.card').dataset.vid)))}
function openItem(id){let x=id?items.find(y=>y.id===id):{id:'',vendor:'',item:'',category:'',unit:'',pounds_per_case:'',price:'',qty_on_hand:0,target_stock:0,last_ordered_date:'',notes:'',barcode:'',image_url:''};for(const [f,k] of [['id','id'],['vendor','vendor'],['item','item'],['category','category'],['unit','unit'],['pounds','pounds_per_case'],['price','price'],['qty','qty_on_hand'],['target','target_stock'],['date','last_ordered_date'],['notes','notes'],['barcode','barcode']])$('#'+f).value=x[k]??'';$('#oq').value=order(x);$('#del').style.display=id?'inline-block':'none';imageFile=null;$('#modal').classList.add('show')}
function closeItem(){$('#modal').classList.remove('show')}
function openVendor(id){let v=id?vendors.find(x=>x.id===id):{id:'',vendor:'',contact_person:'',phone:'',cell:'',email:'',website:'',delivery_days:'',delivery_details:'',notes:''};for(const [f,k] of [['vid','id'],['vname','vendor'],['vcontact','contact_person'],['vphone','phone'],['vcell','cell'],['vemail','email'],['vwebsite','website'],['vdays','delivery_days'],['vdetails','delivery_details'],['vnotes','notes']])$('#'+f).value=v[k]??'';$('#vdelete').style.display=id?'inline-block':'none';$('#vendorModal').classList.add('show')}
function closeVendor(){$('#vendorModal').classList.remove('show')}
$('#qty').oninput=$('#target').oninput=()=>$('#oq').value=Math.max(num($('#target').value)-num($('#qty').value),0);$('#pic').onchange=e=>imageFile=e.target.files[0]||null;
$('#form').onsubmit=async e=>{e.preventDefault();let id=$('#id').value,p={vendor:$('#vendor').value.trim(),item:$('#item').value.trim(),category:$('#category').value.trim()||null,unit:$('#unit').value.trim()||null,pounds_per_case:$('#pounds').value||null,price:$('#price').value||null,qty_on_hand:$('#qty').value||0,target_stock:$('#target').value||0,last_ordered_date:$('#date').value||null,notes:$('#notes').value.trim()||null,barcode:$('#barcode').value.trim()||null,updated_at:new Date().toISOString()};if(imageFile){let path=Date.now()+'-'+imageFile.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('product-images').upload(path,imageFile);if(u.error)return alert(u.error.message);p.image_url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}let r=id?await db.from('inventory_items').update(p).eq('id',id):await db.from('inventory_items').insert(p);if(r.error)return alert(r.error.message);closeItem();await loadAll()};
$('#vendorForm').onsubmit=async e=>{e.preventDefault();let id=$('#vid').value,p={vendor:$('#vname').value.trim(),contact_person:$('#vcontact').value.trim()||null,phone:$('#vphone').value.trim()||null,cell:$('#vcell').value.trim()||null,email:$('#vemail').value.trim()||null,website:$('#vwebsite').value.trim()||null,delivery_days:$('#vdays').value.trim()||null,delivery_details:$('#vdetails').value.trim()||null,notes:$('#vnotes').value.trim()||null,updated_at:new Date().toISOString()};let old=id?vendors.find(v=>String(v.id)===String(id)):null;let r=id?await db.from('vendors').update(p).eq('id',id):await db.from('vendors').insert(p);if(r.error)return alert(r.error.message);if(old&&old.vendor!==p.vendor){let q=await db.from('inventory_items').update({vendor:p.vendor,updated_at:new Date().toISOString()}).eq('vendor',old.vendor);if(q.error)return alert('Vendor saved, but linked items could not be renamed: '+q.error.message)}closeVendor();await loadAll()};
$('#del').onclick=async()=>{if(confirm('Delete this product?')){let r=await db.from('inventory_items').delete().eq('id',$('#id').value);if(r.error)alert(r.error.message);else{closeItem();loadAll()}}};
$('#vdelete').onclick=async()=>{let id=$('#vid').value,v=vendors.find(x=>String(x.id)===String(id));if(!v)return;if(items.some(x=>x.vendor===v.vendor)){return alert('This vendor still has inventory items assigned to it. Reassign or rename those items before deleting the vendor.')}if(confirm('Delete vendor '+v.vendor+'?')){let r=await db.from('vendors').delete().eq('id',id);if(r.error)alert(r.error.message);else{closeVendor();loadAll()}}};
$('#cancel').onclick=closeItem;$('#vcancel').onclick=closeVendor;$('#add').onclick=()=>openItem(null);$('#addVendor').onclick=()=>openVendor(null);$('#search').oninput=renderInventory;$('#vf').onchange=renderInventory;
$('#signin').onclick=async()=>{let r=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#authmsg').textContent=r.error?r.error.message:'Signed in.'};$('#signup').onclick=async()=>{let r=await db.auth.signUp({email:$('#email').value,password:$('#password').value});$('#authmsg').textContent=r.error?r.error.message:'Account created. Check your email to confirm it, then return here and sign in.'};$('#signout').onclick=()=>db.auth.signOut();
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.section').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.tab).classList.add('active')});
function subscribe(){db.channel('yma-live').on('postgres_changes',{event:'*',schema:'public',table:'inventory_items'},()=>loadAll()).on('postgres_changes',{event:'*',schema:'public',table:'vendors'},()=>loadAll()).subscribe()}
$('#scan').onclick=async()=>{if(!('BarcodeDetector'in window))return alert('Barcode scanning is not supported by this browser yet. You can type the barcode manually.');try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=document.createElement('video');v.srcObject=stream;v.autoplay=true;v.playsInline=true;v.style='width:100%';let m=document.createElement('div');m.className='modal show';m.style.zIndex=20;m.innerHTML='<div class="box"><h3>Point camera at barcode</h3><p class="muted">Tap outside this box to cancel.</p></div>';m.firstChild.append(v);document.body.append(m);let d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']}),active=true;m.onclick=e=>{if(e.target===m){active=false;stream.getTracks().forEach(t=>t.stop());m.remove()}};async function tick(){if(!active)return;let c=await d.detect(v).catch(()=>[]);if(c.length){$('#barcode').value=c[0].rawValue;active=false;stream.getTracks().forEach(t=>t.stop());m.remove();return}requestAnimationFrame(tick)}tick()}catch(e){alert('Could not open the camera.')}};
boot();
</script>
</body>
</html>
