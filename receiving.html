<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YMA Receiving</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7f9;color:#172033}header{background:#1f4e78;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d9dee7;border-radius:12px;padding:14px;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d9dee7;padding:8px;text-align:left}th{background:#eef3f7}button,input{font:inherit;padding:8px;border:1px solid #cbd2dc;border-radius:8px}button{cursor:pointer}.primary{background:#1f4e78;color:#fff;border-color:#1f4e78}.success{background:#17733d;color:#fff;border-color:#17733d}.muted{color:#687386;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.qty{width:90px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#eef3f7;font-size:12px}a{color:#1f4e78}@media(max-width:650px){table{display:block;overflow:auto}}</style></head><body><header><h2 style="margin:0">YMA Receiving</h2><div>Match deliveries to closed vendor orders</div></header><main class="wrap"><div class="card"><div class="row"><a href="./">← Back to Inventory</a><button id="refresh">Refresh</button></div><p class="muted">Orders appear here after they are marked ordered/closed in YMA Inventory. Enter what actually arrived, then receive the line.</p></div><div id="status" class="muted"></div><div id="orders"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1"></script><script>const SB='https://lwfrcwjahrzuxjgfialg.supabase.co',KEY='sb_publishable_lEImxF9Mc-ss7VxVLGeJ8w_cpgga_iO';const {createClient}=supabase,db=createClient(SB,KEY),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let vendors=[],rows=[];async function load(){let sess=await db.auth.getSession();if(!sess.data.session){location.href='./';return}$('#status').textContent='Loading closed orders...';let [v,q]=await Promise.all([db.from('vendors').select('id,vendor').order('vendor'),db.from('vendor_order_queue').select('*').eq('status','ordered').order('ordered_at',{ascending:false})]);if(v.error||q.error){$('#status').textContent=(v.error||q.error).message;return}vendors=v.data||[];rows=q.data||[];render();$('#status').textContent=''}function render(){let groups={};rows.forEach(r=>(groups[r.vendor_id]??=[]).push(r));let ids=Object.keys(groups);$('#orders').innerHTML=ids.length?ids.map(id=>{let ven=vendors.find(v=>Number(v.id)===Number(id)),rs=groups[id];return '<div class="card"><h3>'+(ven?esc(ven.vendor):'Vendor')+' <span class="badge">Closed order</span></h3><table><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Difference</th><th>Action</th></tr>'+rs.map(r=>'<tr><td><b>'+esc(r.item_name)+'</b><div class="muted">'+esc(r.unit||'')+'</div></td><td>'+r.qty+'</td><td><input class="qty recv" type="number" min="0" value="'+(r.received_qty||r.qty)+'" data-id="'+r.id+'"></td><td id="diff-'+r.id+'">0</td><td><button class="success receive" data-id="'+r.id+'">Receive & Match</button></td></tr>').join('')+'</table></div>'}).join(''):'<div class="card">No closed orders are waiting to be received.</div>';document.querySelectorAll('.recv').forEach(i=>{let calc=()=>{let r=rows.find(x=>x.id===Number(i.dataset.id));let d=Number(i.value||0)-Number(r.qty||0),el=$('#diff-'+r.id);el.textContent=d===0?'Matched':(d>0?'+'+d+' over':Math.abs(d)+' short')};i.oninput=calc;calc()});document.querySelectorAll('.receive').forEach(b=>b.onclick=()=>receive(Number(b.dataset.id)))}async function receive(id){let r=rows.find(x=>x.id===id),input=document.querySelector('.recv[data-id="'+id+'"]'),received=Math.max(0,Number(input.value||0));if(!confirm('Receive '+received+' of '+r.item_name+'?'))return;let item=null;if(r.inventory_item_id){let x=await db.from('inventory_items').select('id,qty_on_hand').eq('id',r.inventory_item_id).maybeSingle();if(x.error)return alert(x.error.message);item=x.data}if(item&&received>0){let u=await db.from('inventory_items').update({qty_on_hand:Number(item.qty_on_hand||0)+received,updated_at:new Date().toISOString()}).eq('id',item.id);if(u.error)return alert(u.error.message)}let q=await db.from('vendor_order_queue').update({received_qty:received,status:'received',received_at:new Date().toISOString(),closed_at:new Date().toISOString()}).eq('id',id);if(q.error)return alert(q.error.message);await load()}$('#refresh').onclick=load;load();</script></body></html>
